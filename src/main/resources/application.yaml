spring:
  application:
    name: ms-book
  mongodb:
    uri: ${MONGO_URI}
  data:
    mongodb:
      auto-index-creation: true #dev only
  datasource:
    url: ${POSTGRE_URL}
    username: ${POSTGRE_USERNAME}
    password: ${POSTGRE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

secrets:
  google-api-key: ${GOOGLE-API-KEY}

storage:
  provider: minio             # Useful if you add conditional beans later
  endpoint: http://localhost:9090
  region: us-east-1           # MinIO default dummy region
  access-key: ${MINIO_ADMIN}
  secret-key: ${MINIO_PASSWORD}
  bucket-name: scroll-project-media
  paths:
    temp-posts: "temp/posts"
    posts: "posts"
    avatars: "avatars"
  presigned-url-expiration-minutes: 15

clients:
  google-book: "https://www.googleapis.com/books/v1"

